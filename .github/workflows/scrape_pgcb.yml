name: Scrape PGCB Live Data

on:
  schedule:
    - cron: '0 * * * *' # Run at the start of every hour
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci || npm install
        
      - name: Run Scraper
        run: npm run scrape
        
      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add pgcb_live_data.csv pgcb_data.csv
          
          # Only commit and push if there are changes
          if git diff --staged --quiet; then
            echo "No new data to commit"
          else
            git commit -m "chore(data): auto-update PGCB live & historical data [skip ci]"
            git push
            echo "Successfully pushed new data"
          fi
